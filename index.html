<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Galeri</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:#111;font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;display:flex;justify-content:center;align-items:center}
.phone{position:relative;width:100%;max-width:420px;height:100vh;height:100dvh;max-height:900px;background:#000;color:#fff;overflow:hidden}
svg{display:block}
.ic{fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ic-f{fill:#fff}
button{font-family:inherit;color:inherit}

/* ===== PREVIEW (halaman utama) ===== */
#feed{position:absolute;inset:0 0 56px 0;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none;overscroll-behavior:contain}
#feed::-webkit-scrollbar{display:none}
.slide{position:relative;height:100%;scroll-snap-align:start;scroll-snap-stop:always;background:#0c0c0e;overflow:hidden}
.slide .bg{position:absolute;inset:-10%;width:120%;height:120%;object-fit:cover;filter:blur(28px) brightness(.45)}
.slide .main{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.slide::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.4) 0%,transparent 20%,transparent 62%,rgba(0,0,0,.65) 100%)}
.prog{position:absolute;left:0;bottom:0;height:2px;width:0;background:#fff;z-index:4}
.pausei{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:72px;height:72px;border-radius:50%;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:4;pointer-events:none}
.slide.paused .pausei{display:flex}

.top{position:absolute;top:0;left:0;right:0;height:56px;padding-top:6px;display:flex;align-items:center;justify-content:center;z-index:10;font-weight:600;font-size:16px;pointer-events:none}
.top #count{max-width:62%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:rgba(0,0,0,.35);padding:4px 12px;border-radius:14px;font-size:13px;font-variant-numeric:tabular-nums}
.top button{pointer-events:auto;position:absolute;top:14px;width:36px;height:36px;display:flex;align-items:center;justify-content:center;background:none;border:0;cursor:pointer}
#openSearch{right:14px}
#sound{left:14px}

.rail{position:absolute;right:10px;bottom:84px;display:flex;flex-direction:column;align-items:center;gap:20px;z-index:10}
.rail button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:600;cursor:pointer;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.rail .heart.on svg{fill:#fe2c55}
.info{position:absolute;left:14px;right:80px;bottom:72px;z-index:10;display:flex;flex-direction:column;gap:6px;pointer-events:none;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.info .nm{font-weight:700;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.info .mt{font-size:13px;opacity:.85}

.empty{position:absolute;inset:0 0 56px 0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:30px;z-index:3}
.empty p{color:rgba(255,255,255,.6);font-size:14px;line-height:1.5}
.empty h2{font-size:18px}
.btn{background:#fe2c55;border:0;border-radius:4px;padding:11px 22px;font-weight:600;font-size:15px;cursor:pointer}

.nav{position:absolute;left:0;right:0;bottom:0;height:56px;background:#000;display:flex;align-items:center;justify-content:space-around;z-index:12;border-top:1px solid #1c1c1c}
.nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;color:rgba(255,255,255,.6);width:33%;cursor:pointer}
.nav button.on{color:#fff}
.plusbtn{width:44px;height:30px;position:relative}
.plusbtn::before{content:"";position:absolute;left:0;top:0;width:36px;height:30px;border-radius:9px;background:#25f4ee}
.plusbtn::after{content:"";position:absolute;right:0;top:0;width:36px;height:30px;border-radius:9px;background:#fe2c55}
.plusbtn i{position:absolute;left:4px;right:4px;top:0;bottom:0;background:#fff;border-radius:8px;z-index:2;display:flex;align-items:center;justify-content:center}

/* ===== GALERI (menu search) ===== */
#search{position:absolute;inset:0;background:#000;z-index:20;transform:translateY(100%);opacity:0;transition:transform .28s ease,opacity .2s ease;pointer-events:none;display:flex;flex-direction:column}
#search.open{transform:none;opacity:1;pointer-events:auto}
.sbar{display:flex;align-items:center;gap:8px;padding:12px 12px 8px}
.sbar .back{width:32px;height:36px;background:none;border:0;display:flex;align-items:center;justify-content:center;cursor:pointer}
.sfield{flex:1;height:38px;border-radius:4px;background:#2a2a2e;display:flex;align-items:center;gap:8px;padding:0 10px}
.sfield input{flex:1;background:none;border:0;outline:0;color:#fff;font-size:15px;min-width:0}
.sfield input::placeholder{color:rgba(255,255,255,.45)}
.sadd{white-space:nowrap;background:none;border:0;color:#fe2c55;font-weight:600;font-size:15px;padding:0 6px;cursor:pointer}
.stat{padding:4px 14px 8px;font-size:13px;color:rgba(255,255,255,.55)}
.sbody{flex:1;overflow:auto;padding:0 2px 20px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.cell{position:relative;aspect-ratio:3/4;background:#1a1a1d;overflow:hidden;cursor:pointer;border:0;padding:0}
.cell img,.cell video{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.cell .vb{position:absolute;left:6px;bottom:6px;display:flex;align-items:center;gap:3px;font-size:11px;font-weight:600;text-shadow:0 1px 3px rgba(0,0,0,.7)}
.cell .fv{position:absolute;right:6px;top:6px}
.noresult{padding:40px 20px;text-align:center;color:rgba(255,255,255,.55);font-size:14px;display:none}

.toast{position:absolute;left:50%;bottom:76px;transform:translateX(-50%);background:rgba(40,40,44,.95);padding:9px 16px;border-radius:8px;font-size:13px;z-index:50;display:none}
#folderWrap{display:none}
.upd{display:none;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 10px;margin:2px 12px 6px;padding:9px 12px;background:#1a1a1d;border-radius:8px;font-size:13px}
.upd .ut{flex:1;min-width:0;line-height:1.35}
.upd .us{color:rgba(255,255,255,.55);font-size:12px}
.upd button{background:#2a2a2e;border:0;border-radius:6px;padding:8px 14px;font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap}
.upd button[disabled]{opacity:.5}
.upd.avail button{background:#fe2c55}
.upd .pb{width:100%;height:3px;background:#2a2a2e;border-radius:2px;overflow:hidden;display:none}
.upd .pb i{display:block;height:100%;width:0;background:#fe2c55}
.nav button{position:relative}
.nav .dot{display:none;position:absolute;top:4px;left:calc(50% + 8px);width:9px;height:9px;border-radius:50%;background:#fe2c55;border:2px solid #000}
:root{--sat:var(--jt,max(env(safe-area-inset-top,0px),var(--safe-area-inset-top,0px)));--sab:var(--jb,max(env(safe-area-inset-bottom,0px),var(--safe-area-inset-bottom,0px)))}
.top{top:var(--sat)}
.nav{height:calc(56px + var(--sab));padding-bottom:var(--sab)}
#feed{bottom:calc(56px + var(--sab))}
.empty{bottom:calc(56px + var(--sab))}
.rail{bottom:calc(84px + var(--sab))}
.info{bottom:calc(72px + var(--sab))}
.toast{bottom:calc(76px + var(--sab))}
.sbar{padding-top:calc(12px + var(--sat))}
.sbody{padding-bottom:var(--sab)}
.hd{padding:12px 12px 6px;font-size:14px;font-weight:600;color:rgba(255,255,255,.7)}
.fgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:0 10px 8px}
.fcard{background:none;border:0;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;color:#fff}
.fcard .cv{position:relative;aspect-ratio:1/1;background:#1a1a1d;border-radius:8px;overflow:hidden}
.fcard .cv img,.fcard .cv video{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.fcard .cv .all{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.25)}
.fcard .fn{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fcard .fc{font-size:12px;color:rgba(255,255,255,.55);margin-top:-4px}
body.native .phone{max-width:none;max-height:none}
body.native{align-items:stretch}
</style>
</head>
<body>
<div class="phone">

  <!-- PREVIEW: halaman pertama saat aplikasi dibuka -->
  <section id="home">
    <div id="feed"></div>

    <div class="empty" id="empty">
      <svg width="54" height="54" viewBox="0 0 24 24" class="ic" style="stroke:rgba(255,255,255,.5)"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-8 9"/></svg>
      <h2>Galeri masih kosong</h2>
      <p>Tambahkan foto atau video.<br>Hasilnya bisa di-scroll seperti feed.</p>
      <button class="btn" id="emptyAdd">Tambah foto / video</button>
    </div>

    <div class="top">
      <button id="sound" aria-label="Suara">
        <svg id="soundOff" width="24" height="24" viewBox="0 0 24 24" class="ic"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>
        <svg id="soundOn" width="24" height="24" viewBox="0 0 24 24" class="ic" style="display:none"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16.5 8.5a5 5 0 010 7M19 6a8.5 8.5 0 010 12"/></svg>
      </button>
      <span id="count" style="display:none"></span>
      <button id="openSearch" aria-label="Buka galeri">
        <svg width="26" height="26" viewBox="0 0 24 24" class="ic"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      </button>
    </div>

    <div class="rail" id="rail" style="display:none">
      <button class="heart" id="likeBtn" aria-label="Suka">
        <svg width="34" height="34" viewBox="0 0 24 24" class="ic-f"><path d="M12 21s-8-5.2-8-11a4.7 4.7 0 018-3.3A4.7 4.7 0 0120 10c0 5.8-8 11-8 11z"/></svg>
      </button>
    </div>

    <div class="info" id="infoBox" style="display:none">
      <div class="nm" id="infoNm"></div>
      <div class="mt" id="infoMt"></div>
    </div>

    <nav class="nav">
      <button class="on" id="navHome">
        <svg width="26" height="26" viewBox="0 0 24 24" class="ic-f"><path d="M12 3l9 8h-3v9h-5v-6h-2v6H6v-9H3z"/></svg>Beranda
      </button>
      <button id="navAdd" aria-label="Tambah">
        <div class="plusbtn"><i><svg width="20" height="20" viewBox="0 0 24 24" style="fill:none;stroke:#000;stroke-width:3;stroke-linecap:round"><path d="M12 5v14M5 12h14"/></svg></i></div>
      </button>
      <button id="navGal">
        <svg width="26" height="26" viewBox="0 0 24 24" class="ic"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-8 9"/></svg>Galeri<i class="dot" id="navDot"></i>
      </button>
    </nav>
  </section>

  <!-- GALERI: muncul hanya saat ikon cari / tombol Galeri diklik -->
  <section id="search" aria-hidden="true">
    <div class="sbar">
      <button class="back" id="closeSearch" aria-label="Kembali">
        <svg width="24" height="24" viewBox="0 0 24 24" class="ic"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <div class="sfield">
        <svg width="18" height="18" viewBox="0 0 24 24" class="ic" style="stroke:rgba(255,255,255,.55)"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Cari nama file" autocomplete="off">
      </div>
      <button class="sadd" id="sAdd">Tambah</button>
    </div>
    <div class="upd" id="upd">
      <div class="ut"><div id="updTxt">Versi aplikasi</div><div class="us" id="updSub"></div></div>
      <button id="updBtn">Cek update</button>
      <div class="pb" id="updPb"><i id="updBar"></i></div>
    </div>
    <div class="stat" id="stat"></div>
    <div class="sbody">
      <div id="folderWrap"><div class="hd" id="hdFolder">Folder</div><div class="fgrid" id="folders"></div></div>
      <div class="hd" id="hdFiles" style="display:none">Berkas</div>
      <div class="grid" id="grid"></div>
      <div class="noresult" id="noresult">Tidak ada hasil.</div>
    </div>
  </section>

  <div class="toast" id="toast"></div>
  <input type="file" id="file" accept="image/*,video/*" multiple hidden>
</div>

<script>
/* ---------- penyimpanan lokal (IndexedDB) ---------- */
const DB='galeri-tiktok', ST='items';
let db=null, memMode=false, memItems=[], memId=1;
function openDB(){return new Promise(res=>{
  try{
    const r=indexedDB.open(DB,1);
    r.onupgradeneeded=()=>r.result.createObjectStore(ST,{keyPath:'id',autoIncrement:true});
    r.onsuccess=()=>{db=r.result;res()};
    r.onerror=()=>{memMode=true;res()};
  }catch(e){memMode=true;res()}
})}
function tx(mode){return db.transaction(ST,mode).objectStore(ST)}
function dbAll(){return new Promise(res=>{
  if(memMode)return res(memItems.slice());
  const q=tx('readonly').getAll();q.onsuccess=()=>res(q.result);q.onerror=()=>res([]);
})}
function dbAdd(it){return new Promise(res=>{
  if(memMode){it.id=memId++;memItems.push(it);return res(it.id)}
  const q=tx('readwrite').add(it);q.onsuccess=()=>res(q.result);q.onerror=()=>res(null);
})}
function dbPut(it){return new Promise(res=>{
  if(memMode)return res();
  const q=tx('readwrite').put(it);q.onsuccess=()=>res();q.onerror=()=>res();
})}
function dbDel(id){return new Promise(res=>{
  if(memMode){memItems=memItems.filter(i=>i.id!=id);return res()}
  const q=tx('readwrite').delete(id);q.onsuccess=()=>res();q.onerror=()=>res();
})}

/* ---------- state ---------- */
let items=[], view=[], viewName='Semua', curFolder=null, urls={}, soundOn=false, curId=null;
const $=id=>document.getElementById(id);
const feed=$('feed'), grid=$('grid');
const isVid=it=>it.type.startsWith('video');
const fmt=t=>new Date(t).toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'});
const baseName=n=>n.replace(/\.[^.]+$/,'');
const NATIVE=!!(window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform());
function url(it){if(it.src)return it.src;return urls[it.id]||(urls[it.id]=URL.createObjectURL(it.blob))}
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',2200)}

/* ---------- render ---------- */
const ICON_PLAY='<svg width="12" height="12" viewBox="0 0 24 24" class="ic-f"><path d="M7 4l13 8-13 8z"/></svg>';
const ICON_HEART_S='<svg width="16" height="16" viewBox="0 0 24 24" style="fill:#fe2c55"><path d="M12 21s-8-5.2-8-11a4.7 4.7 0 018-3.3A4.7 4.7 0 0120 10c0 5.8-8 11-8 11z"/></svg>';

function mount(s){
  if(s.dataset.m==='1')return;
  const it=items.find(i=>i.id==s.dataset.id);if(!it)return;
  s.dataset.m='1';
  if(isVid(it)){
    s.insertAdjacentHTML('afterbegin',`<video class="main" src="${url(it)}" loop muted playsinline preload="auto"></video>`);
    const v=s.querySelector('video'),p=s.querySelector('.prog');
    v.addEventListener('timeupdate',()=>{p.style.width=(v.duration?v.currentTime/v.duration*100:0)+'%'});
    s.onclick=()=>{ if(v.paused){s.classList.remove('paused');v.muted=!soundOn;v.play().catch(()=>{})}else{v.pause();s.classList.add('paused')} };
    if(String(s.dataset.id)===String(curId))playCurrent();
  }else{
    s.insertAdjacentHTML('afterbegin',`<img class="bg" src="${url(it)}" alt=""><img class="main" src="${url(it)}" alt="${baseName(it.name)}">`);
  }
}
function unmount(s){
  if(s.dataset.m!=='1')return;
  s.dataset.m='';s.onclick=null;
  s.querySelectorAll('video,img').forEach(e=>{if(e.tagName==='VIDEO'){e.pause();e.removeAttribute('src');e.load()}e.remove()});
}
window.__insets=(t,b)=>{const r=document.documentElement.style;r.setProperty('--jt',t+'px');r.setProperty('--jb',b+'px')};
function renderFeed(keepId,list,name){
  view=list||items;viewName=name||'Semua';
  io.disconnect();near.disconnect();
  feed.innerHTML='';
  view.forEach(it=>{
    const s=document.createElement('div');
    s.className='slide';s.dataset.id=it.id;
    s.innerHTML=isVid(it)?'<div class="pausei"><svg width="34" height="34" viewBox="0 0 24 24" class="ic-f"><path d="M7 4l13 8-13 8z"/></svg></div><div class="prog"></div>':'';
    feed.appendChild(s);io.observe(s);near.observe(s);
  });
  const has=view.length>0;
  $('empty').style.display=has?'none':'flex';
  $('rail').style.display=has?'flex':'none';
  $('infoBox').style.display=has?'block':'none';
  $('count').style.display=has?'inline-block':'none';
  if(has){
    const target=keepId!=null&&view.find(i=>i.id==keepId)?keepId:view[0].id;
    const el=feed.querySelector(`.slide[data-id="${target}"]`);if(el)mount(el);
    goTo(target,true);
    setCurrent(target);
    setTimeout(playCurrent,60);setTimeout(playCurrent,350);
  }
}
const folderKey=it=>it.folder||'Unggahan';
function folderList(){
  const m=new Map();
  items.forEach(it=>{const k=folderKey(it);
    if(!m.has(k))m.set(k,{key:k,name:k.split('/').filter(Boolean).pop()||k,items:[]});
    m.get(k).items.push(it)});
  return [...m.values()].sort((a,b)=>b.items[0].added-a.items[0].added);
}
function coverHTML(it){return isVid(it)?`<video src="${url(it)}#t=0.1" muted playsinline preload="metadata"></video>`:`<img src="${url(it)}" loading="lazy" alt="">`}
function folderCard(name,count,cover,onclick,all){
  const b=document.createElement('button');b.className='fcard';
  b.innerHTML=`<div class="cv">${cover?coverHTML(cover):''}${all?'<div class="all"><svg width="30" height="30" viewBox="0 0 24 24" class="ic"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-8 9"/></svg></div>':''}</div><div class="fn"></div><div class="fc">${count} item</div>`;
  b.querySelector('.fn').textContent=name;
  b.onclick=onclick;return b;
}
function folderItems(){return !curFolder||curFolder.all?items:items.filter(i=>folderKey(i)===curFolder.key)}
function renderGrid(){
  const q=$('q').value.trim().toLowerCase();
  const nameOk=i=>i.name.toLowerCase().includes(q);
  const fl=$('folders');fl.innerHTML='';
  let showFolders=false;
  if(!curFolder){
    let fs=folderList();
    if(q)fs=fs.filter(f=>f.name.toLowerCase().includes(q));
    if(!q&&items.length)fl.appendChild(folderCard('Semua',items.length,items[0],()=>openFolder({key:'*',name:'Semua',all:true}),true));
    fs.forEach(f=>fl.appendChild(folderCard(f.name,f.items.length,f.items[0],()=>openFolder(f))));
    showFolders=fl.children.length>0;
    gridList=q?items.filter(nameOk):[];
  }else{
    gridList=folderItems().filter(nameOk);
  }
  $('folderWrap').style.display=showFolders?'block':'none';
  $('hdFiles').style.display=!curFolder&&gridList.length?'block':'none';
  grid.innerHTML='';gridShown=0;appendCells(PAGE);
  $('q').placeholder=curFolder?'Cari di '+curFolder.name:'Cari folder atau nama file';
  $('stat').textContent=curFolder?`${curFolder.name} · ${gridList.length} item`:(items.length&&!q?`${folderList().length} folder · ${items.length} item`:'');
  const none=items.length&&!showFolders&&!gridList.length;
  const nr=$('noresult');
  if(!items.length){nr.textContent=NATIVE?'Tidak ada foto/video, atau izin belum diberikan.':'Belum ada isi. Ketuk "Tambah".';nr.style.display='block'}
  else if(none){nr.textContent='Tidak ada hasil.';nr.style.display='block'}
  else nr.style.display='none';
}
function openFolder(f){curFolder=f;$('q').value='';renderGrid();document.querySelector('.sbody').scrollTop=0}
let gridList=[],gridShown=0;const PAGE=90;
function appendCells(n){
  const list=gridList.slice(gridShown,gridShown+n);gridShown+=list.length;
  list.forEach(it=>{
    const c=document.createElement('button');c.className='cell';c.setAttribute('aria-label',it.name);
    c.innerHTML=(isVid(it)?`<video src="${url(it)}#t=0.1" muted playsinline preload="metadata"></video><div class="vb">${ICON_PLAY}</div>`
                          :`<img src="${url(it)}" loading="lazy" alt="">`)+(it.fav?`<div class="fv">${ICON_HEART_S}</div>`:'');
    c.onclick=()=>{const list=curFolder?folderItems():items;const nm=curFolder?curFolder.name:'Semua';closeSearch();renderFeed(it.id,list,nm)};
    grid.appendChild(c);
  });
}
document.querySelector('.sbody').addEventListener('scroll',e=>{
  const b=e.target;if(b.scrollTop+b.clientHeight>b.scrollHeight-600&&gridShown<gridList.length)appendCells(PAGE);
});

/* ---------- navigasi feed ---------- */
function goTo(id,instant){
  const el=feed.querySelector(`.slide[data-id="${id}"]`);
  if(el)feed.scrollTo({top:el.offsetTop,behavior:instant?'instant':'smooth'});
}
function setCurrent(id){
  curId=id;
  const it=view.find(i=>i.id==id)||items.find(i=>i.id==id);if(!it)return;
  $('infoNm').textContent=baseName(it.name);
  $('infoMt').textContent=(isVid(it)?'Video':'Foto')+' · '+fmt(it.added);
  $('likeBtn').classList.toggle('on',!!it.fav);
  $('count').textContent=viewName+' · '+(view.indexOf(it)+1)+' / '+view.length;
}
let bgPaused=false, searchOpen=false;
function playCurrent(){
  if(bgPaused||searchOpen)return;
  const s=feed.querySelector(`.slide[data-id="${curId}"]`);if(!s)return;
  const v=s.querySelector('video');if(!v||s.classList.contains('paused'))return;
  v.loop=true;v.muted=!soundOn;
  const p=v.play();
  if(p&&p.catch)p.catch(()=>{v.muted=true;v.play().catch(()=>{})});
}
function pauseAll(){feed.querySelectorAll('video').forEach(v=>v.pause())}
/* aplikasi ke background / layar mati -> jeda; kembali -> lanjut */
window.__bg=on=>{bgPaused=!!on;on?pauseAll():playCurrent()};
document.addEventListener('visibilitychange',()=>window.__bg(document.hidden));
window.addEventListener('pagehide',()=>window.__bg(true));
window.addEventListener('pageshow',()=>window.__bg(document.hidden));

const io=new IntersectionObserver(es=>{
  es.forEach(e=>{
    const v=e.target.querySelector('video');
    if(e.isIntersecting&&e.intersectionRatio>=.6){
      setCurrent(e.target.dataset.id);
      if(v){e.target.classList.remove('paused');playCurrent()}
    }else if(v){v.pause();try{v.currentTime=0}catch(_){}}
  });
},{root:feed,threshold:[.6]});

const near=new IntersectionObserver(es=>{
  es.forEach(e=>{e.isIntersecting?mount(e.target):unmount(e.target)});
},{root:feed,rootMargin:'100% 0px'});

/* ---------- menu galeri ---------- */
function openSearch(){searchOpen=true;pauseAll();curFolder=null;$('q').value='';renderGrid();$('search').classList.add('open');$('search').setAttribute('aria-hidden','false');
  $('navHome').classList.remove('on');$('navGal').classList.add('on')}
function closeSearch(){searchOpen=false;setTimeout(playCurrent,30);$('search').classList.remove('open');$('search').setAttribute('aria-hidden','true');$('q').blur();
  $('navHome').classList.add('on');$('navGal').classList.remove('on')}
$('openSearch').onclick=openSearch;$('navGal').onclick=openSearch;
$('closeSearch').onclick=()=>{ if(curFolder){curFolder=null;$('q').value='';renderGrid()} else closeSearch() };
$('navHome').onclick=()=>{closeSearch();if(view.length)goTo(view[0].id)};
$('q').oninput=renderGrid;
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSearch()});

/* ---------- tambah item ---------- */
const pick=()=>NATIVE?loadNative(true):$('file').click();
$('navAdd').onclick=pick;$('emptyAdd').onclick=pick;$('sAdd').onclick=pick;
$('file').onchange=async e=>{
  const files=[...e.target.files].filter(f=>/^(image|video)\//.test(f.type));
  e.target.value='';
  if(!files.length)return;
  let n=0,last=null;
  for(const f of files){
    const it={name:f.name,type:f.type,blob:f,added:Date.now()+n,fav:false};
    const id=await dbAdd(it);if(id!=null){it.id=id;n++;last=id}
  }
  items=(await dbAll()).sort((a,b)=>b.added-a.added);
  renderFeed(last);renderGrid();
  toast(n+' item ditambahkan');
};

/* ---------- suka & hapus ---------- */
$('likeBtn').onclick=async()=>{
  const it=items.find(i=>i.id==curId);if(!it)return;
  it.fav=!it.fav;
  if(NATIVE){const f=new Set(JSON.parse(localStorage.getItem('favs')||'[]'));it.fav?f.add(String(it.id)):f.delete(String(it.id));localStorage.setItem('favs',JSON.stringify([...f]))}
  else await dbPut(it);
  $('likeBtn').classList.toggle('on',it.fav);
};
/* ---------- update aplikasi (GitHub Releases) ---------- */
const REPO='nufaart/galeri-tiktok';
const upd={local:0,name:'',remote:0,url:'',busy:false,dlTag:0,checked:false};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function updUI(txt,sub,avail,btn,disabled){
  $('upd').style.display='flex';
  $('updTxt').textContent=txt;$('updSub').textContent=sub||'';
  $('upd').classList.toggle('avail',!!avail);
  $('updBtn').textContent=btn;$('updBtn').disabled=!!disabled;
  $('navDot').style.display=(upd.remote>upd.local)?'block':'none';
}
function updIdle(){
  if(upd.remote>upd.local)updUI('Update tersedia: versi '+upd.remote,'Terpasang: versi '+upd.local,true,'Update');
  else updUI('Aplikasi sudah terbaru',upd.local?'Versi '+upd.local:'',false,'Cek update');
}
async function checkUpdate(manual){
  const G=Capacitor.Plugins.Gallery;
  if(!upd.local){try{const v=await G.getVersion();upd.local=Number(v.code);upd.name=v.name}catch(_){}}
  updUI('Mengecek update…','',false,'Cek update',true);
  try{
    const r=await fetch('https://api.github.com/repos/'+REPO+'/releases/latest',{headers:{Accept:'application/vnd.github+json'}});
    if(r.status===404){upd.remote=0;updUI('Belum ada rilis di GitHub','Versi terpasang: '+upd.local,false,'Cek update');return}
    if(!r.ok)throw new Error('HTTP '+r.status);
    const j=await r.json();
    const a=(j.assets||[]).find(x=>/\.apk$/i.test(x.name));
    upd.remote=parseInt(String(j.tag_name).replace(/\D/g,''),10)||0;
    upd.url=a?a.browser_download_url:'';
    upd.checked=true;
    updIdle();
    if(manual&&!(upd.remote>upd.local))toast('Sudah versi terbaru');
  }catch(e){
    updUI('Gagal mengecek update',String(e.message||e)+' — periksa internet','' ,'Coba lagi');
  }
}
async function doUpdate(){
  if(upd.busy)return;
  if(!(upd.remote>upd.local)){checkUpdate(true);return}
  upd.busy=true;
  const G=Capacitor.Plugins.Gallery,pb=$('updPb'),bar=$('updBar');
  try{
    let st=await G.status();
    if(st.state!=='ready'||upd.dlTag!==upd.remote){
      if(!upd.url)throw new Error('File APK tidak ada di rilis');
      pb.style.display='block';bar.style.width='0';
      await G.download({url:upd.url});
      upd.dlTag=upd.remote;
      for(;;){
        await sleep(400);st=await G.status();
        updUI('Mengunduh update… '+st.percent+'%','Jangan tutup aplikasi',true,'Update',true);
        bar.style.width=st.percent+'%';
        if(st.state==='ready')break;
        if(st.state==='error')throw new Error(st.error||'unduhan gagal');
      }
    }
    pb.style.display='none';
    try{
      await G.install();
      updUI('Ikuti layar pemasangan Android','Ketuk Pasang / Install, lalu buka aplikasi lagi',true,'Update');
    }catch(e){
      const m=String((e&&(e.message||e.code))||e);
      if(/NEED_PERMISSION/.test(m))updUI('Izin pemasangan diperlukan','Aktifkan "Izinkan dari sumber ini" untuk Galeri, kembali ke aplikasi, lalu ketuk Update lagi',true,'Update');
      else throw e;
    }
  }catch(e){
    pb.style.display='none';
    upd.dlTag=0;
    updUI('Update gagal',String((e&&e.message)||e),true,'Coba lagi');
  }finally{upd.busy=false}
}
$('updBtn').onclick=()=>{ if(upd.remote>upd.local)doUpdate(); else checkUpdate(true) };

/* ---------- suara ---------- */
$('sound').onclick=()=>{
  soundOn=!soundOn;
  $('soundOn').style.display=soundOn?'block':'none';
  $('soundOff').style.display=soundOn?'none':'block';
  feed.querySelectorAll('video').forEach(v=>v.muted=!soundOn);
  playCurrent();
};

window.addEventListener('error',e=>{
  if(e.target&&(e.target.tagName==='IMG'||e.target.tagName==='VIDEO')){toast('Gagal memuat media');return}
  if(NATIVE)showEmpty('Terjadi error',String(e.message||e),'Coba lagi');
},true);
window.addEventListener('unhandledrejection',e=>{if(NATIVE)showEmpty('Terjadi error',String((e.reason&&e.reason.message)||e.reason),'Coba lagi')});

/* ---------- mulai: langsung ke preview ---------- */
function fileSrc(p){
  try{ if(typeof Capacitor.convertFileSrc==='function'){const u=Capacitor.convertFileSrc('file://'+p); if(u&&!u.startsWith('file://'))return u} }catch(_){}
  return location.origin+'/_capacitor_file_'+p;
}
async function loadNative(manual){
  showEmpty('Memuat galeri…','Meminta izin dan membaca foto/video.<br>Jika muncul permintaan izin, ketuk <b>Izinkan</b>.','Muat ulang');
  try{
    const G=(Capacitor.Plugins&&Capacitor.Plugins.Gallery)||(typeof Capacitor.registerPlugin==='function'&&Capacitor.registerPlugin('Gallery'));
    if(!G)throw new Error('Plugin galeri tidak terdaftar di aplikasi');
    const r=await G.list({limit:3000});
    const favs=new Set(JSON.parse(localStorage.getItem('favs')||'[]'));
    items=r.items.map(o=>({id:'m'+o.id,name:o.name||'media',type:o.type||'image/jpeg',added:o.added,
      src:fileSrc(o.path),folder:o.path.replace(/\/[^\/]*$/,''),fav:favs.has('m'+o.id)})).sort((a,b)=>b.added-a.added);
    renderFeed();renderGrid();
    if(manual)toast(items.length+' item dimuat');
    if(!items.length)showEmpty('Galeri kosong','Tidak ada foto atau video di HP ini.','Muat ulang');
  }catch(e){
    items=[];renderFeed();renderGrid();
    const m=(e&&(e.message||e.code||String(e)))||'';
    if(/DENIED/i.test(m))showEmpty('Izin galeri diperlukan','Aplikasi perlu izin membaca foto dan video agar galeri tampil. File tidak diubah atau diunggah.','Beri izin');
    else showEmpty('Galeri gagal dibaca','Pesan: '+m,'Coba lagi');
  }
}
function showEmpty(h,p,b){
  const e=$('empty');e.querySelector('h2').textContent=h;e.querySelector('p').innerHTML=p;$('emptyAdd').textContent=b;e.style.display='flex';
}
(async()=>{
  if(NATIVE){
    document.body.classList.add('native');
    $('sAdd').textContent='Muat ulang';
    await loadNative();
    checkUpdate(false);
  }else{
    await openDB();
    items=(await dbAll()).sort((a,b)=>b.added-a.added);
    renderFeed();
  }
})();
</script>
